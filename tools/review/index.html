<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Problem — content review</title>
<style>
  :root {
    --bg: #08110e;
    --surface: #111f1a;
    --surface-2: #182a24;
    --surface-3: #223a32;
    --text: #f4f0e5;
    --muted: #b9c6be;
    --line: #33544a;
    --primary: #34d399;
    --on-primary: #06251a;
    --brass: #d6a756;
    --on-brass: #2a1c05;
    --violet: #8b5cf6;
    --error: #f87171;
    --ok: #34d399;
    --fix: #e0a640;
    --skip: #9aa8a0;
    --radius: 18px;
    --shadow: 0 18px 50px rgba(0, 0, 0, .28);
    --sans: "Segoe UI", "Manrope", system-ui, -apple-system, sans-serif;
    --serif: "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --mono: "Cascadia Mono", "Roboto Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-width: 320px;
    background:
      radial-gradient(1100px 650px at 8% -8%, rgba(52, 211, 153, .08), transparent 60%),
      radial-gradient(900px 700px at 95% 0%, rgba(214, 167, 86, .07), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  a { color: var(--primary); }
  [hidden] { display: none !important; }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 24px;
    border-bottom: 1px solid rgba(51, 84, 74, .6);
    background: rgba(8, 17, 14, .92);
    backdrop-filter: blur(16px);
  }
  .mark {
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: linear-gradient(145deg, #f0c878, #d6a756 48%, #a9772f);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .3);
  }
  .mark .piece { width: 33px; height: 33px; color: #06251a; --piece-stroke: #2a1c05; --piece-eye: #f6e4bf; }
  .brand { min-width: 250px; }
  .brand h1 { margin: 0; font-family: var(--serif); font-size: 21px; letter-spacing: .2px; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .progress-wrap { flex: 1; min-width: 220px; max-width: 520px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; margin-bottom: 6px; }
  .progress-top strong { font-size: 14px; }
  .progress-top span { color: var(--muted); font-size: 12px; }
  .progress-bar { height: 7px; border-radius: 99px; background: #1d332b; overflow: hidden; }
  .progress-bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #1f9d75, var(--primary)); transition: width .25s ease; }
  .summary { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border-radius: 99px;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
  }
  .pill.ok { color: var(--ok); background: rgba(52, 211, 153, .11); }
  .pill.fix { color: var(--fix); background: rgba(224, 166, 64, .11); }
  .pill.skip { color: var(--skip); background: rgba(154, 168, 160, .1); }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .btn {
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 10px;
    font-weight: 650;
    font-size: 12px;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .btn:hover { background: var(--surface-3); border-color: #4b7162; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
  .btn.primary:hover { background: #5ee5b3; }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .layout {
    display: grid;
    grid-template-columns: 330px minmax(0, 1fr);
    gap: 20px;
    max-width: 1540px;
    margin: 0 auto;
    padding: 20px 24px 40px;
  }
  .sidebar {
    position: sticky;
    top: 94px;
    align-self: start;
    max-height: calc(100vh - 112px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 300px;
  }
  .panel {
    background: linear-gradient(180deg, rgba(24, 42, 36, .88), rgba(17, 31, 26, .92));
    border: 1px solid rgba(51, 84, 74, .7);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .filters { padding: 14px; flex: 0 0 auto; }
  .filters h2, .list-head h2 { margin: 0; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .09em; }
  .search {
    width: 100%;
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: rgba(8, 17, 14, .55);
    color: var(--text);
    outline: none;
  }
  .search:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(52, 211, 153, .12); }
  .selects { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .selects select { min-width: 0; }
  select, textarea {
    width: 100%;
    background: rgba(8, 17, 14, .55);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 10px;
    outline: none;
  }
  select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(52, 211, 153, .1); }
  .list-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px 9px; gap: 8px; }
  .list-head span { color: var(--muted); font-size: 11px; }
  .puzzle-list { overflow: auto; padding: 0 8px 10px; min-height: 0; scrollbar-width: thin; }
  .puzzle-list::-webkit-scrollbar { width: 8px; }
  .puzzle-list::-webkit-scrollbar-thumb { background: #2a463b; border-radius: 99px; }
  .list-item {
    width: 100%;
    display: grid;
    grid-template-columns: 12px 1fr auto;
    gap: 9px;
    align-items: center;
    text-align: left;
    padding: 9px 9px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    transition: background .12s, border-color .12s;
  }
  .list-item:hover { background: rgba(34, 58, 50, .55); }
  .list-item.active { background: rgba(52, 211, 153, .1); border-color: rgba(52, 211, 153, .35); }
  .dot { width: 8px; height: 8px; border-radius: 99px; background: #3d594e; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(52, 211, 153, .12); }
  .dot.fix { background: var(--fix); box-shadow: 0 0 0 3px rgba(224, 166, 64, .12); }
  .dot.skip { background: var(--skip); }
  .list-title { min-width: 0; }
  .list-title b { display: block; font-size: 12px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-title small { display: block; color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .list-id { color: var(--muted); font-family: var(--mono); font-size: 10px; }
  .detail { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .hero { padding: 20px; }
  .eyebrow { color: var(--brass); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .hero-row { display: flex; align-items: flex-start; gap: 16px; margin-top: 7px; }
  .hero h2 { margin: 0; font-family: var(--serif); font-size: clamp(24px, 3vw, 34px); line-height: 1.1; letter-spacing: -.2px; }
  .hero p { margin: 6px 0 0; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .chip {
    display: inline-flex; gap: 5px; align-items: center;
    padding: 5px 9px; border-radius: 99px; background: var(--surface-2);
    color: var(--muted); font-size: 11px; border: 1px solid rgba(51, 84, 74, .45);
  }
  .chip.brass { color: var(--on-brass); background: var(--brass); border-color: transparent; font-weight: 700; }
  .chip.green { color: var(--primary); background: rgba(52, 211, 153, .1); border-color: rgba(52, 211, 153, .25); }
  .source { margin-left: auto; text-align: right; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .source a { color: var(--brass); }
  .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .board-card { padding: 12px; }
  .board-card h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .board-card .sub { margin-top: 7px; color: var(--muted); font-size: 11px; }
  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 100%;
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 13px;
    border: 1px solid rgba(51, 84, 74, .8);
    box-shadow: 0 10px 24px rgba(0, 0, 0, .25);
    user-select: none;
  }
  .sq { position: relative; min-width: 0; min-height: 0; }
  .sq.light { background: #e9dfc8; }
  .sq.dark { background: #7e9b85; }
  .sq.last::before {
    content: ""; position: absolute; inset: 0;
    background: rgba(214, 167, 86, .35);
    box-shadow: inset 0 0 0 3px rgba(214, 167, 86, .48);
    z-index: 0;
  }
  .sq .piece { position: absolute; inset: 4%; width: 92%; height: 92%; z-index: 1; }
  .piece.white { color: #f6f0e2; --piece-stroke: #8b5e25; --piece-eye: #15251e; }
  .piece.black { color: #263a30; --piece-stroke: #0b1511; --piece-eye: #eadfc8; }
  .coord { position: absolute; z-index: 2; pointer-events: none; font-family: var(--mono); font-size: 8px; font-weight: 700; opacity: .68; }
  .coord.file { right: 4px; bottom: 3px; }
  .coord.rank { left: 4px; top: 3px; }
  .sq.light .coord { color: #3e4a3f; }
  .sq.dark .coord { color: #f4f0e5; }
  .text-card { padding: 18px; }
  .text-card h3, .review-card h3, .solution-card h3 { margin: 0 0 12px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .text-table { display: flex; flex-direction: column; }
  .text-row { display: grid; grid-template-columns: 112px minmax(0, 1fr) minmax(0, 1fr); gap: 14px; padding: 9px 0; border-top: 1px solid rgba(51, 84, 74, .3); }
  .text-row:first-of-type { border-top: 0; }
  .text-row.head { padding: 0 0 7px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
  .text-row .label { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding-top: 1px; }
  .text-row .ru { color: var(--text); }
  .text-row .en { color: var(--muted); }
  .text-row .ru b, .text-row .en b { color: var(--text); }
  .hint-tier { color: var(--brass); font-family: var(--mono); font-size: 10px; margin-right: 4px; }
  .solution-card, .review-card { padding: 16px 18px; }
  .solution-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .solution-head h3 { margin: 0; }
  .solution-head .btn { margin-left: auto; }
  .setup-note { margin-top: 10px; color: var(--muted); font-size: 12px; }
  .san-line { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .san {
    display: inline-flex; align-items: center;
    padding: 4px 8px; border-radius: 7px;
    background: var(--surface-2); border: 1px solid rgba(51, 84, 74, .5);
    font-family: var(--mono); color: var(--text); font-size: 12px;
  }
  .san.setup { color: var(--brass); border-color: rgba(214, 167, 86, .4); }
  .review-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .review-head h3 { margin: 0; }
  .status-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .status-btn {
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    font-weight: 650;
    font-size: 12px;
  }
  .status-btn:hover { background: var(--surface-3); }
  .status-btn.active[data-status="ok"] { background: rgba(52, 211, 153, .15); border-color: rgba(52, 211, 153, .6); color: var(--ok); }
  .status-btn.active[data-status="fix"] { background: rgba(224, 166, 64, .15); border-color: rgba(224, 166, 64, .6); color: var(--fix); }
  .status-btn.active[data-status="skip"] { background: rgba(154, 168, 160, .13); border-color: rgba(154, 168, 160, .5); color: var(--text); }
  .comment { min-height: 92px; resize: vertical; margin-top: 2px; }
  .review-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; color: var(--muted); font-size: 11px; }
  .saved { color: var(--primary); }
  .saved.dirty { color: var(--fix); }
  .nav-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 14px 18px; }
  .nav-meta { color: var(--muted); font-size: 12px; text-align: center; flex: 1; }
  .empty { padding: 50px 20px; text-align: center; color: var(--muted); }
  .empty h2 { color: var(--text); font-family: var(--serif); }
  details.tech { padding: 13px 18px; color: var(--muted); font-size: 11px; }
  details.tech summary { cursor: pointer; color: var(--muted); }
  details.tech dl { display: grid; grid-template-columns: 100px 1fr; gap: 5px 12px; margin: 10px 0 0; }
  details.tech dt { color: #7e9b85; }
  details.tech dd { margin: 0; word-break: break-word; }
  .toast {
    position: fixed; right: 22px; bottom: 22px; z-index: 50;
    padding: 10px 14px; border-radius: 10px;
    background: var(--surface-3); border: 1px solid var(--line);
    color: var(--text); box-shadow: var(--shadow); font-size: 12px;
    opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .kbd { color: var(--muted); font-size: 10px; }
  .kbd kbd { font-family: var(--mono); font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; background: var(--surface-2); }
  @media (max-width: 1120px) {
    .layout { grid-template-columns: 280px minmax(0, 1fr); padding: 16px; gap: 14px; }
    .topbar { flex-wrap: wrap; }
    .brand { min-width: 0; flex: 1; }
    .progress-wrap { order: 3; flex-basis: 100%; max-width: none; }
    .top-actions { order: 2; }
    .sidebar { top: 142px; max-height: calc(100vh - 160px); }
  }
  @media (max-width: 820px) {
    .topbar { padding: 12px 14px; gap: 10px; }
    .mark { width: 38px; height: 38px; flex-basis: 38px; border-radius: 11px; }
    .mark .piece { width: 27px; height: 27px; }
    .brand h1 { font-size: 17px; }
    .brand p { display: none; }
    .layout { display: block; padding: 14px; }
    .sidebar { position: static; max-height: none; margin-bottom: 14px; }
    .puzzle-list { max-height: 230px; }
    .boards { grid-template-columns: 1fr; }
    .board-card { max-width: 480px; margin: 0 auto; width: 100%; }
    .text-row { grid-template-columns: 1fr; gap: 3px; padding: 9px 0; }
    .text-row.head { display: none; }
    .text-row .label { padding-top: 0; }
    .hero-row { display: block; }
    .source { text-align: left; margin: 8px 0 0; }
    .nav-row { flex-wrap: wrap; }
    .nav-meta { flex-basis: 100%; order: 3; }
    .top-actions .btn { padding: 7px 9px; }
  }
  @media print {
    body { background: #fff; color: #111; }
    .topbar, .sidebar, .nav-row, .review-card, .toast, details.tech { display: none !important; }
    .layout { display: block; padding: 0; max-width: none; }
    .panel { box-shadow: none; border-color: #ccc; background: #fff; color: #111; }
    .text-row .en, .text-row .label, .board-card h3 { color: #444; }
  }
</style>
</head>

    p: "p-pawn",
    n: "p-knight",
    b: "p-bishop",
    r: "p-rook",
    q: "p-queen",
    k: "p-king",
  };
  const puzzles = DATA.puzzles;
  const byId = new Map(puzzles.map((p) => [p.id, p]));

  let notes = loadNotes();
  let currentId = puzzles[0]?.id ?? null;
  let filtered = [];
  let solutionVisible = false;
  let searchTimer = null;
  let commentTimer = null;
  let toastTimer = null;

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function safeUrl(value) {
    try {
      const url = new URL(value);
      return url.protocol === "https:" || url.protocol === "http:" ? url.href : null;
    } catch {
      return null;
    }
  }

  function levelLabel(level, lang = "ru") {
    return LEVELS[level]?.[lang] ?? level;
  }

  function chapterLabel(chapter, lang = "ru") {
    return CHAPTERS[chapter]?.[lang] ?? chapter;
  }

  function taskLabel(puzzle) {
    if (puzzle.task.type === "MATE") return "Мат в " + puzzle.task.plies;
    if (puzzle.task.type === "WIN") return "Выигрыш в " + puzzle.task.plies;
    return puzzle.task.type + " " + puzzle.task.plies;
  }

  function sideLabel(side) {
    return side === "w" ? "Ход белых" : "Ход чёрных";
  }

  function formatTime(seconds) {
    const s = Math.max(0, Number(seconds) || 0);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function statusOf(id) {
    return notes[id]?.status ?? null;
  }

  function noteOf(id) {
    return notes[id] ?? { status: null, comment: "", updatedAt: null };
  }

  function loadNotes() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      const source = parsed && typeof parsed.notes === "object" ? parsed.notes : parsed;
      const result = {};
      if (source && typeof source === "object") {
        for (const [id, note] of Object.entries(source)) {
          if (!byId.has(id) || !note || typeof note !== "object") continue;
          const status = STATUS[note.status] ? note.status : null;
          const comment = typeof note.comment === "string" ? note.comment : "";
          if (!status && !comment.trim()) continue;
          result[id] = { status, comment, updatedAt: note.updatedAt ?? null };
        }
      }
      return result;
    } catch (error) {
      console.warn("Cannot read review notes", error);
      return {};
    }
  }

  function saveNotes() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: 1,
        contentVersion: DATA.contentVersion,
        updatedAt: new Date().toISOString(),
        notes,
      }));
    } catch (error) {
      console.warn("Cannot save review notes", error);
    }
  }

  function normalizeNote(id, status, comment) {
    const clean = (comment ?? "").trim();
    if (!status && !clean) {
      delete notes[id];
      return;
    }
    notes[id] = {
      status,
      comment: clean,
      updatedAt: new Date().toISOString(),
    };
  }

  function reviewedCount() {
    return puzzles.filter((p) => statusOf(p.id)).length;
  }

  function countStatus(status) {
    return puzzles.filter((p) => statusOf(p.id) === status).length;
  }

  function updateProgress() {
    const reviewed = reviewedCount();
    const total = puzzles.length;
    const pct = total ? Math.round((reviewed / total) * 100) : 0;
    $("#progress-label").textContent = `Проверено ${reviewed} / ${total}`;
    $("#progress-percent").textContent = `${pct}%`;
    $("#progress-fill").style.width = `${pct}%`;
    const unreviewed = total - reviewed;
    $("#summary").innerHTML = [
      `<span class="pill ok">✅ ${countStatus("ok")}</span>`,
      `<span class="pill fix">✏️ ${countStatus("fix")}</span>`,
      `<span class="pill skip">⏭ ${countStatus("skip")}</span>`,
      `<span class="pill">○ ${unreviewed}</span>`,
    ].join("");
    $("#content-version").textContent = "v" + DATA.contentVersion;
  }

  function filteredPuzzles() {
    const query = $("#search").value.trim().toLowerCase();
    return puzzles.filter((p) => {
      if (state.level !== "ALL" && p.level !== state.level) return false;
      if (state.chapter !== "ALL" && p.chapter !== state.chapter) return false;
      const status = statusOf(p.id);
      if (state.status === "unreviewed" && status) return false;
      if (state.status !== "ALL" && state.status !== "unreviewed" && status !== state.status) return false;
      if (query) {
        const haystack = [p.id, p.title?.ru, p.title?.en, p.chapter].join(" ").toLowerCase();
        if (!haystack.includes(query)) return false;
      }
      return true;
    });
  }

  const state = { level: "ALL", chapter: "ALL", status: "ALL" };

  function renderFilterOptions() {
    const levelSelect = $("#filter-level");
    levelSelect.innerHTML = `<option value="ALL">Все уровни</option>` +
      Object.entries(LEVELS).map(([id, labels]) => `<option value="${escapeHtml(id)}">${escapeHtml(labels.ru)}</option>`).join("");
    levelSelect.value = state.level;

    const statusSelect = $("#filter-status");
    statusSelect.innerHTML = [
      ["ALL", "Все статусы"],
      ["unreviewed", "Без статуса"],
      ["ok", "✅ Проверено"],
      ["fix", "✏️ Нужны правки"],
      ["skip", "⏭ Пропущено"],
    ].map(([value, label]) => `<option value="${value}">${escapeHtml(label)}</option>`).join("");
    statusSelect.value = state.status;

    renderChapterOptions();
  }

  function renderChapterOptions() {
    const chapterSelect = $("#filter-chapter");
    const chapters = [...new Set(puzzles
      .filter((p) => state.level === "ALL" || p.level === state.level)
      .map((p) => p.chapter))]
      .sort((a, b) => chapterLabel(a).localeCompare(chapterLabel(b), "ru"));
    chapterSelect.innerHTML = `<option value="ALL">Все главы</option>` +
      chapters.map((id) => `<option value="${escapeHtml(id)}">${escapeHtml(chapterLabel(id))}</option>`).join("");
    if (state.chapter !== "ALL" && !chapters.includes(state.chapter)) state.chapter = "ALL";
    chapterSelect.value = state.chapter;
  }

  function renderList() {
    filtered = filteredPuzzles();
    if (!filtered.some((p) => p.id === currentId)) {
      currentId = filtered[0]?.id ?? null;
    }
    $("#list-meta").textContent = `${filtered.length} из ${puzzles.length}`;
    const list = $("#puzzle-list");
    list.innerHTML = filtered.length
      ? filtered.map((p) => {
        const status = statusOf(p.id);
        const statusClass = status ? status : "";
        return `<button class="list-item ${p.id === currentId ? "active" : ""}" data-id="${escapeHtml(p.id)}">
          <span class="dot ${statusClass}" aria-hidden="true"></span>
          <span class="list-title">
            <b>${escapeHtml(p.title?.ru ?? p.id)}</b>
            <small>${escapeHtml(levelLabel(p.level))} · ${escapeHtml(chapterLabel(p.chapter))}</small>
          </span>
          <span class="list-id">${escapeHtml(p.id)}</span>
        </button>`;
      }).join("")
      : `<div class="empty" style="padding:28px 12px"><p>Нет задач под фильтр.</p></div>`;
    $$(".list-item", list).forEach((button) => {
      button.addEventListener("click", () => selectPuzzle(button.dataset.id));
    });
  }

  function selectPuzzle(id) {
    if (!byId.has(id)) return;
    currentId = id;
    solutionVisible = false;
    renderList();
    renderDetail();
    const item = $(`[data-id="${CSS.escape(id)}"]`, $("#puzzle-list"));
    if (item) item.scrollIntoView({ block: "nearest" });
    $("#detail")?.scrollIntoView({ block: "start", behavior: "smooth" });
  }

  function nav(delta) {
    if (!filtered.length) return;
    const index = filtered.findIndex((p) => p.id === currentId);
    const next = filtered[(index + delta + filtered.length) % filtered.length];
    if (next) selectPuzzle(next.id);
  }

  function nextUnreviewed() {
    if (!filtered.length) return;
    const start = Math.max(0, filtered.findIndex((p) => p.id === currentId));
    const ordered = filtered.slice(start + 1).concat(filtered.slice(0, start + 1));
    const next = ordered.find((p) => !statusOf(p.id));
    if (next) selectPuzzle(next.id);
    else showToast("В текущем фильтре все задачи проверены");
  }

  function renderTextRow(label, ru, en) {
    return `<div class="text-row">
      <div class="label">${escapeHtml(label)}</div>
      <div class="ru">${escapeHtml(ru ?? "—")}</div>
      <div class="en">${escapeHtml(en ?? "—")}</div>
    </div>`;
  }

  function renderHintRows(hints) {
    return (hints ?? []).map((hint) => renderTextRow(
      `Подсказка ${hint.tier}`,
      `${hint.tier === 1 ? "Идея" : hint.tier === 2 ? "Фигура" : "Ход"} · ${hint.ru}`,
      `${hint.tier === 1 ? "Idea" : hint.tier === 2 ? "Piece" : "Move"} · ${hint.en}`,
    )).join("");
  }

  function renderBoard(elementId, fen, lastMove) {
    const element = document.getElementById(elementId);
    if (!element) return;
    const placement = String(fen).split(/\s+/)[0];
    const rows = placement.split("/");
    element.innerHTML = "";
    element.setAttribute("aria-label", "Шахматная позиция: " + fen);
    const files = "abcdefgh";
    const lastSquares = new Set(lastMove ? [lastMove.from, lastMove.to] : []);
    for (let row = 0; row < 8; row += 1) {
      const rank = 8 - row;
      let file = 0;
      for (const char of rows[row] ?? "8") {
        if (/\d/.test(char)) {
          for (let n = 0; n < Number(char); n += 1) {
            element.appendChild(makeSquare(files[file], rank, null, lastSquares));
            file += 1;
          }
        } else {
          element.appendChild(makeSquare(files[file], rank, char, lastSquares));
          file += 1;
        }
      }
      while (file < 8) {
        element.appendChild(makeSquare(files[file], rank, null, lastSquares));
        file += 1;
      }
    }
  }

  function makeSquare(file, rank, piece, lastSquares) {
    const square = document.createElement("div");
    const light = ((file.charCodeAt(0) - 97) + rank) % 2 === 0;
    square.className = "sq " + (light ? "light" : "dark");
    const name = file + rank;
    if (lastSquares.has(name)) square.classList.add("last");
    square.title = name;
    if (piece) {
      const color = piece === piece.toUpperCase() ? "white" : "black";
      const type = piece.toLowerCase();
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 64 64");
      svg.setAttribute("class", "piece " + color);
      svg.setAttribute("aria-hidden", "true");
      const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
      use.setAttribute("href", "#" + (PIECE_SYMBOL[type] ?? "p-pawn"));
      svg.appendChild(use);
      square.appendChild(svg);
    }
    if (rank === 1) {
      const fileLabel = document.createElement("span");
      fileLabel.className = "coord file";
      fileLabel.textContent = file;
      square.appendChild(fileLabel);
    }
    if (file === "a") {
      const rankLabel = document.createElement("span");
      rankLabel.className = "coord rank";
      rankLabel.textContent = String(rank);
      square.appendChild(rankLabel);
    }
    return square;
  }

  function sourceHtml(puzzle) {
    const source = puzzle.source ?? {};
    const url = safeUrl(source.url);
    const label = source.provider === "lichess" ? "Lichess" : (source.provider || "source");
    const id = source.id ? ` · ${escapeHtml(source.id)}` : "";
    const link = url
      ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}${id}</a>`
      : `${escapeHtml(label)}${id}`;
    return `${link}${source.license ? ` · ${escapeHtml(source.license)}` : ""}`;
  }

  function renderDetail() {
    const detail = $("#detail");
    if (!currentId || !byId.has(currentId)) {
      detail.innerHTML = `<section class="panel empty"><h2>Нет задач под фильтр</h2><p>Измените фильтры слева.</p></section>`;
      return;
    }
    const p = byId.get(currentId);
    const note = noteOf(p.id);
    const index = filtered.findIndex((item) => item.id === p.id);
    const prev = filtered[(index - 1 + filtered.length) % filtered.length];
    const next = filtered[(index + 1) % filtered.length];
    const status = note.status;
    const setupText = p.setup ? `<div class="setup-note">Подводка соперника: <span class="san setup">${escapeHtml(p.setup.san)}</span> <span style="font-family:var(--mono);color:#7e9b85">${escapeHtml(p.setup.uci)}</span></div>` : "";
    const solutionLine = p.solution.san.map((san) => `<span class="san">${escapeHtml(san)}</span>`).join("");
    detail.innerHTML = `
      <section class="panel hero">
        <div class="eyebrow">${escapeHtml(levelLabel(p.level))} · ${escapeHtml(chapterLabel(p.chapter))}</div>
        <div class="hero-row">
          <div style="min-width:0;flex:1">
            <h2>${escapeHtml(p.title?.ru ?? p.id)}</h2>
            <p>${escapeHtml(p.id)} · ${escapeHtml(p.title?.en ?? "")}</p>
            <div class="chips">
              <span class="chip brass">${escapeHtml(taskLabel(p))}</span>
              <span class="chip">Рейтинг ${escapeHtml(p.rating)}</span>
              <span class="chip">Время ${escapeHtml(formatTime(p.timeLimitSec))}</span>
              <span class="chip green">${escapeHtml(sideLabel(p.sideToMove))}</span>
              ${(p.themes ?? []).slice(0, 5).map((theme) => `<span class="chip">${escapeHtml(theme)}</span>`).join("")}
            </div>
          </div>
          <div class="source">${sourceHtml(p)}</div>
        </div>
      </section>

      <section class="boards">
        <div class="panel board-card">
          <h3>Доска задачи</h3>
          <div class="board" id="board-start"></div>
          <div class="sub">${p.setup ? `Подводка ${escapeHtml(p.setup.san)} · ` : ""}позиция после setup-хода · ${escapeHtml(p.sideToMove === "w" ? "ход белых" : "ход чёрных")}</div>
        </div>
        <div class="panel board-card">
          <h3>Финальная позиция</h3>
          <div class="board" id="board-final"></div>
          <div class="sub">После линии решения · проверьте мат/результат</div>
        </div>
      </section>

      <section class="panel text-card">
        <h3>Тексты</h3>
        <div class="text-table">
          <div class="text-row head"><div class="label"></div><div>RU</div><div>EN</div></div>
          ${renderTextRow("Заголовок", p.title?.ru, p.title?.en)}
          ${renderTextRow("Задание", p.prompt?.ru, p.prompt?.en)}
          ${renderHintRows(p.hints)}
          ${renderTextRow("Разбор", p.explanation?.ru, p.explanation?.en)}
        </div>
      </section>

      <section class="panel solution-card">
        <div class="solution-head">
          <h3>Решение</h3>
          <button class="btn ghost" id="toggle-solution" aria-expanded="${solutionVisible ? "true" : "false"}">${solutionVisible ? "Скрыть решение" : "Показать решение"}</button>
        </div>
        ${setupText}
        <div class="san-line" id="solution-line" ${solutionVisible ? "" : "hidden"}>${solutionLine}</div>
      </section>

      <section class="panel review-card">
        <div class="review-head">
          <h3>Вердикт</h3>
          <span class="pill">${status ? STATUS[status].icon + " " + STATUS[status].label : "○ Без статуса"}</span>
        </div>
        <div class="status-buttons">
          <button class="status-btn ${status === "ok" ? "active" : ""}" data-status="ok" type="button">✅ Проверено</button>
          <button class="status-btn ${status === "fix" ? "active" : ""}" data-status="fix" type="button">✏️ Нужны правки</button>
          <button class="status-btn ${status === "skip" ? "active" : ""}" data-status="skip" type="button">⏭ Пропустить</button>
        </div>
        <textarea class="comment" id="comment" maxlength="5000" placeholder="Комментарий: что исправить, где спойлер, что уточнить…"></textarea>
        <div class="review-foot">
          <span class="saved" id="save-state">Сохранено локально</span>
          <span class="kbd"><kbd>←</kbd> <kbd>→</kbd> — навигация · <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> — статус</span>
        </div>
      </section>

      <section class="panel nav-row">
        <button class="btn" id="prev-puzzle" ${filtered.length <= 1 ? "disabled" : ""}>← Предыдущая</button>
        <div class="nav-meta">${index + 1} / ${filtered.length} · <button class="btn ghost" id="next-unreviewed" style="padding:4px 8px">Следующая без статуса</button></div>
        <button class="btn" id="next-puzzle" ${filtered.length <= 1 ? "disabled" : ""}>Следующая →</button>
      </section>

      <details class="panel tech">
        <summary>Технические данные</summary>
        <dl>
          <dt>FEN до setup</dt><dd>${escapeHtml(p.fenBeforeSetup)}</dd>
          <dt>FEN после setup</dt><dd>${escapeHtml(p.fen)}</dd>
          <dt>Финальный FEN</dt><dd>${escapeHtml(p.solution.finalFen)}</dd>
          <dt>UCI решения</dt><dd>${escapeHtml(p.solution.uci.join(" "))}</dd>
          <dt>ID</dt><dd>${escapeHtml(p.id)}</dd>
        </dl>
      </details>`;

    renderBoard("board-start", p.fen, p.startLastMove);
    renderBoard("board-final", p.solution.finalFen, p.solution.lastMove);
    const textarea = $("#comment");
    textarea.value = note.comment ?? "";
    textarea.addEventListener("input", () => {
      setSaveState("Сохраняется…", true);
      clearTimeout(commentTimer);
      commentTimer = setTimeout(() => {
        normalizeNote(p.id, statusOf(p.id), textarea.value);
        saveNotes();
        updateProgress();
        renderList();
        setSaveState("Сохранено локально", false);
      }, 320);
    });
    textarea.addEventListener("blur", () => {
      normalizeNote(p.id, statusOf(p.id), textarea.value);
      saveNotes();
      updateProgress();
      setSaveState("Сохранено локально", false);
    });
    $$(".status-btn", detail).forEach((button) => {
      button.addEventListener("click", () => {
        const value = button.dataset.status;
        const nextStatus = statusOf(p.id) === value ? null : value;
        normalizeNote(p.id, nextStatus, textarea.value);
        saveNotes();
        updateProgress();
        renderList();
        renderDetail();
      });
    });
    $("#toggle-solution").addEventListener("click", () => {
      solutionVisible = !solutionVisible;
      const line = $("#solution-line");
      line.hidden = !solutionVisible;
      $("#toggle-solution").textContent = solutionVisible ? "Скрыть решение" : "Показать решение";
      $("#toggle-solution").setAttribute("aria-expanded", String(solutionVisible));
    });
    $("#prev-puzzle").addEventListener("click", () => nav(-1));
    $("#next-puzzle").addEventListener("click", () => nav(1));
    $("#next-unreviewed").addEventListener("click", nextUnreviewed);
  }

  function setSaveState(text, dirty) {
    const el = $("#save-state");
    if (!el) return;
    el.textContent = text;
    el.classList.toggle("dirty", dirty);
  }

  function showToast(message) {
    const toast = $("#toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
  }

  function applyFilters() {
    renderList();
    renderDetail();
  }

  function exportJson() {
    const noteList = puzzles
      .filter((p) => statusOf(p.id) || noteOf(p.id).comment)
      .map((p) => ({
        puzzleId: p.id,
        status: statusOf(p.id) ?? "unreviewed",
        comment: noteOf(p.id).comment ?? "",
        updatedAt: noteOf(p.id).updatedAt ?? null,
      }));
    const payload = {
      contentVersion: DATA.contentVersion,
      generatedAt: DATA.generatedAt,
      exportedAt: new Date().toISOString(),
      summary: {
        total: puzzles.length,
        reviewed: reviewedCount(),
        ok: countStatus("ok"),
        fix: countStatus("fix"),
        skip: countStatus("skip"),
        unreviewed: puzzles.length - reviewedCount(),
      },
      notes: noteList,
    };
    download("review-notes.json", JSON.stringify(payload, null, 2), "application/json");
    showToast("review-notes.json экспортирован");
  }

  function exportMarkdown() {
    const lines = [];
    lines.push("# Chess Problem — content review");
    lines.push("");
    lines.push("- contentVersion: `" + DATA.contentVersion + "`");
    lines.push("- generatedAt: `" + DATA.generatedAt + "`");
    lines.push("- exportedAt: `" + new Date().toISOString() + "`");
    lines.push("- reviewed: **" + reviewedCount() + " / " + puzzles.length + "**");
    lines.push("- ✅ " + countStatus("ok") + " · ✏️ " + countStatus("fix") + " · ⏭ " + countStatus("skip"));
    lines.push("");
    lines.push("| ID | Level | Chapter | Status | Comment |");
    lines.push("| --- | --- | --- | --- | --- |");
    for (const p of puzzles) {
      const status = statusOf(p.id);
      const icon = status ? STATUS[status].icon : "—";
      const label = status ? STATUS[status].label : "";
      const comment = (noteOf(p.id).comment || "").replaceAll("|", "\\|").replaceAll("\n", "<br>");
      lines.push(`| ${p.id} | ${levelLabel(p.level)} | ${chapterLabel(p.chapter)} | ${icon} ${label} | ${comment} |`);
    }
    download("review-notes.md", lines.join("\n") + "\n", "text/markdown");
    showToast("review-notes.md экспортирован");
  }

  function download(filename, content, type) {
    const blob = new Blob([content], { type: type + ";charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = filename;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function bindFilters() {
    $("#filter-level").addEventListener("change", (event) => {
      state.level = event.target.value;
      state.chapter = "ALL";
      renderChapterOptions();
      applyFilters();
    });
    $("#filter-chapter").addEventListener("change", (event) => {
      state.chapter = event.target.value;
      applyFilters();
    });
    $("#filter-status").addEventListener("change", (event) => {
      state.status = event.target.value;
      applyFilters();
    });
    $("#search").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(applyFilters, 140);
    });
    $("#export-json").addEventListener("click", exportJson);
    $("#export-md").addEventListener("click", exportMarkdown);
  }

  document.addEventListener("keydown", (event) => {
    if (event.target instanceof HTMLElement && event.target.matches("input, textarea, select")) return;
    if (event.key === "ArrowLeft" || event.key === "j" || event.key === "J") {
      event.preventDefault();
      nav(-1);
    } else if (event.key === "ArrowRight" || event.key === "k" || event.key === "K") {
      event.preventDefault();
      nav(1);
    } else if (event.key === "1") {
      setStatusByKey("ok");
    } else if (event.key === "2") {
      setStatusByKey("fix");
    } else if (event.key === "3") {
      setStatusByKey("skip");
    } else if (event.key === "s" || event.key === "S") {
      const toggle = $("#toggle-solution");
      if (toggle) toggle.click();
    }
  });

  function setStatusByKey(status) {
    if (!currentId) return;
    const textarea = $("#comment");
    normalizeNote(currentId, status, textarea ? textarea.value : "");
    saveNotes();
    updateProgress();
    renderList();
    renderDetail();
  }

  renderFilterOptions();
  bindFilters();
  updateProgress();
  renderList();
  renderDetail();

  if (!localStorage.getItem(STORAGE_KEY)) {
    showToast("Заметки сохраняются в localStorage этого браузера");
  }
})();
</script>
</body>
</html>
