name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-content:
    name: Docs & content
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install validators
        run: npm ci --prefix tools

      - name: Check documentation links
        run: node tools/check-docs.mjs

      - name: Validate sample puzzles
        run: node tools/validate-content.mjs

  # Android job will be added in v0.2.0 after the Gradle scaffold:
  # unit tests, lint, detekt, debug APK.
