name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-content:
    name: Docs & content
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install validators
        run: npm ci --prefix tools

      - name: Check documentation links
        run: node tools/check-docs.mjs

      - name: Validate production puzzles
        run: node tools/validate-content.mjs

      - name: Validate sample puzzles
        run: node tools/validate-content.mjs content/samples

      - name: Build content review
        run: npm run review --prefix tools

  android:
    name: Android build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Static analysis (detekt + ktlint)
        run: ./gradlew detekt --no-daemon

      - name: Core and UI tests, debug APK, release AAB and lint
        run: ./gradlew :core:test :ui:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:bundleRelease :app:lintRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-problem-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
