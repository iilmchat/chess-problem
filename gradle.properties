org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP 2.2.10 still registers generated sources through kotlin.sourceSets.
# AGP 9 built-in Kotlin rejects that by default; allow it until KSP migrates.
android.disallowKotlinSourceSets=false

kotlin.code.style=official

# Roborazzi: эталоны скриншотов лежат в ui/src/test/screenshots (Smoke/QA v0.5.0).
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
